<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Downvote Tracker</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    :root {
      --bs-body-bg: #0f172a; /* Slate 900 */
      --bs-body-color: #f8fafc; /* Slate 50 */
      --card-bg: #1e293b; /* Slate 800 */
      --accent-blue: #3b82f6;
    }

    body {
      font-family: 'Inter', sans-serif;
      width: 350px;
      min-height: 480px;
      background-color: var(--bs-body-bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .custom-card {
      background-color: var(--card-bg);
      border: 1px solid #334155; /* Slate 700 */
      border-radius: 1rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .custom-card:hover {
      border-color: var(--accent-blue);
    }

    .count-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--accent-blue);
      line-height: 1;
    }

    .btn-action {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.6rem;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background-color: #334155;
      color: #fff;
      border-color: #475569;
    }

    @keyframes subtle-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }
    .animate-pulse-subtle { animation: subtle-pulse 2s infinite ease-in-out; }

    .support-link {
      text-decoration: none;
      color: #94a3b8;
      font-weight: 500;
      transition: color 0.2s;
    }
    .support-link:hover { color: var(--accent-blue); }
    
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin-bottom: 0.6rem; font-size: 0.875rem; }
  </style>
</head>

<body class="p-4">

  <header class="text-center mb-4">
    <div class="header-icon rounded-circle d-flex align-items-center justify-content-center mx-auto mb-2">
      <i class="bi bi-hand-thumbs-down-fill fs-3 text-primary"></i>
    </div>
    <h1 class="h5 fw-bold mb-0">Downvote Tracker</h1>
    <p class="text-uppercase small fw-semibold tracking-wider text-secondary mb-0" style="font-size: 0.65rem; letter-spacing: 0.075rem;">Your daily kindness stats</p>
  </header>

  <div class="custom-card p-3 mb-3 text-center">
    <h2 class="small fw-semibold text-secondary text-uppercase mb-2" style="font-size: 0.7rem;">Downvotes Today</h2>
    <div id="downvoteCount" class="count-text animate-pulse-subtle">
      0
    </div>
  </div>

  <div class="custom-card p-3 mb-3">
    <h3 class="small fw-bold mb-3">Support this project <span class="text-danger">❤️</span></h3>
    <ul>
      <li>
        <i class="bi bi-star-fill text-warning me-2"></i>
        <a href="https://github.com/BaskLash/Linkedin-Downvote" target="_blank" class="support-link">Star on GitHub</a>
      </li>
      <li>
        <i class="bi bi-cup-hot-fill text-orange me-2" style="color: #fb923c;"></i>
        <a href="https://buymeacoffee.com/olivierluethy" target="_blank" class="support-link">Buy me a coffee</a>
      </li>
      <li id="share-extension" class="cursor-pointer">
        <i class="bi bi-chat-heart-fill text-info me-2" style="color: #f472b6 !important;"></i>
        <span class="support-link" style="cursor: pointer;">Share with friends</span>
      </li>
    </ul>
  </div>

  <div class="row g-2 mb-4">
    <div class="col-6">
      <button id="feature-request" class="btn btn-action w-100 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-lightbulb text-warning"></i> Feature
      </button>
    </div>
    <div class="col-6">
      <button id="report-bug" class="btn btn-action w-100 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-exclamation-circle text-danger"></i> Bug
      </button>
    </div>
  </div>

  <footer class="mt-auto text-center pt-2">
    <p class="text-uppercase fw-medium text-secondary" style="font-size: 0.6rem; letter-spacing: 0.1em;">
      Built with <i class="bi bi-heart-fill text-primary mx-1"></i> for LinkedIn
    </p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
